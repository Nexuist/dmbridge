name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $EXPECTED_TAG."
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - name: Package npm executable
        run: npm run package:npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            dmbridge-*.tgz
            dmbridge-*.tgz.sha256
          if-no-files-found: error

  executables:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
          - runner: macos-15-intel
            artifact: macos-x64
          - runner: ubuntu-24.04
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - runner: windows-2025
            artifact: windows-x64
          - runner: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: npm ci
      - name: Package standalone executable
        run: npm run package:executable
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.artifact }}
          path: |
            artifacts/dmbridge-*.tar.gz
            artifacts/dmbridge-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs:
      - verify
      - executables
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create consolidated checksums
        run: find release -maxdepth 1 -name '*.sha256' -type f -exec cat {} + | sort > release/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
