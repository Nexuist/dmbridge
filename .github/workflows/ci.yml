name: ci

on:
  push:
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm run package:executable
      - run: npm pack --dry-run
